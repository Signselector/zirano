<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Roll-out">
  <style>
    .s{stroke:#14171A;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .n{fill:#00D97A;stroke:none;opacity:0;animation:light 4s infinite}
    .n1{animation-delay:.5s}.n2{animation-delay:.8s}.n3{animation-delay:1.1s}.n4{animation-delay:1.4s}
    .n5{animation-delay:1.7s}.n6{animation-delay:2s}.n7{animation-delay:2.3s}.n8{animation-delay:2.6s}
    .l{stroke:#00D97A;opacity:0;animation:lline 4s infinite;stroke-width:1}
    .l1{animation-delay:.5s}.l2{animation-delay:.8s}.l3{animation-delay:1.1s}.l4{animation-delay:1.4s}
    .l5{animation-delay:1.7s}.l6{animation-delay:2s}.l7{animation-delay:2.3s}.l8{animation-delay:2.6s}
    @keyframes light{0%{opacity:0;transform:scale(.4)}8%{opacity:1;transform:scale(1)}78%{opacity:1}92%,100%{opacity:0}}
    @keyframes lline{0%{opacity:0}8%{opacity:.5}78%{opacity:.5}92%,100%{opacity:0}}
    .n,.l{transform-box:fill-box;transform-origin:center}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.n{opacity:1}.l{opacity:.5}}
  </style>
  <circle cx="24" cy="24" r="3" fill="#14171A"/>
  <line x1="24" y1="24" x2="10" y2="10" class="l l1"/><circle cx="10" cy="10" r="2.2" class="n n1"/>
  <line x1="24" y1="24" x2="38" y2="10" class="l l2"/><circle cx="38" cy="10" r="2.2" class="n n2"/>
  <line x1="24" y1="24" x2="42" y2="24" class="l l3"/><circle cx="42" cy="24" r="2.2" class="n n3"/>
  <line x1="24" y1="24" x2="38" y2="38" class="l l4"/><circle cx="38" cy="38" r="2.2" class="n n4"/>
  <line x1="24" y1="24" x2="24" y2="42" class="l l5"/><circle cx="24" cy="42" r="2.2" class="n n5"/>
  <line x1="24" y1="24" x2="10" y2="38" class="l l6"/><circle cx="10" cy="38" r="2.2" class="n n6"/>
  <line x1="24" y1="24" x2="6" y2="24" class="l l7"/><circle cx="6" cy="24" r="2.2" class="n n7"/>
  <line x1="24" y1="24" x2="24" y2="6" class="l l8"/><circle cx="24" cy="6" r="2.2" class="n n8"/>
</svg>
