<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Energiemanagement">
  <style>
    .s{stroke:#14171A;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .p{fill:#00D97A;stroke:none;opacity:0}
    .p1{animation:flow1 3s linear infinite}
    .p2{animation:flow2 3s linear infinite .75s}
    .p3{animation:flow3 3s linear infinite 1.5s}
    .p4{animation:flow4 3s linear infinite 2.25s}
    @keyframes flow1{0%{transform:translate(0,0);opacity:0}10%{opacity:1}40%{transform:translate(-9px,-9px);opacity:0}100%{opacity:0}}
    @keyframes flow2{0%{transform:translate(0,0);opacity:0}10%{opacity:1}40%{transform:translate(9px,-9px);opacity:0}100%{opacity:0}}
    @keyframes flow3{0%{transform:translate(0,0);opacity:0}10%{opacity:1}40%{transform:translate(9px,9px);opacity:0}100%{opacity:0}}
    @keyframes flow4{0%{transform:translate(0,0);opacity:0}10%{opacity:1}40%{transform:translate(-9px,9px);opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="18" y="18" width="12" height="12" rx="2" class="s"/>
  <path d="M18 18L11 11M30 18l7-7M30 30l7 7M18 30l-7 7" class="s" opacity=".5"/>
