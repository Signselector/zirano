  <circle cx="9.5" cy="38.5" r="2.5" class="s"/>
  <circle cx="17" cy="17" r="1.6" class="p p1"/>
  <circle cx="31" cy="17" r="1.6" class="p p2"/>
  <circle cx="31" cy="31" r="1.6" class="p p3"/>
  <circle cx="17" cy="31" r="1.6" class="p p4"/>
