<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Batteriespeicher">
  <style>
    .s{stroke:#14171A;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lvl{fill:#00D97A;transform-origin:center 36px;animation:charge 3.6s cubic-bezier(.4,0,.2,1) infinite}
    .bolt{fill:none;stroke:#00D97A;opacity:0;animation:blink 3.6s infinite}
    @keyframes charge{0%{transform:scaleY(.12)}55%,88%{transform:scaleY(1)}100%{transform:scaleY(.12)}}
    @keyframes blink{0%,8%{opacity:0}16%,46%{opacity:1}54%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.lvl{transform:scaleY(.8)}.bolt{opacity:1}}
  </style>
  <path d="M20 8h8" class="s" stroke-width="2.5"/>
  <rect x="15" y="11" width="18" height="29" rx="2.5" class="s"/>
  <rect x="18.5" y="15" width="11" height="21" rx="1" class="lvl" opacity=".9"/>
  <path d="M25.5 20l-4 6h5l-4 6" class="s bolt" stroke-width="1.8" transform="translate(0 -3)"/>
</svg>
